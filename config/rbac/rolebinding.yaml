---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opal-manager-rolebinding
  labels:
    app.kubernetes.io/name: opal
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opal-manager-role
subjects:
  - kind: ServiceAccount
    name: opal-controller-manager
    namespace: opal-system

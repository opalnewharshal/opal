---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opal-manager-role
  labels:
    app.kubernetes.io/name: opal
    app.kubernetes.io/component: controller
rules:
  # WorkloadOutcome management
  - apiGroups: [opal.io]
    resources: [workloadoutcomes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [opal.io]
    resources: [workloadoutcomes/status]
    verbs: [get, update, patch]
  - apiGroups: [opal.io]
    resources: [workloadoutcomes/finalizers]
    verbs: [update]

  # ClusterForecast management
  - apiGroups: [opal.io]
    resources: [clusterforecasts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [opal.io]
    resources: [clusterforecasts/status]
    verbs: [get, update, patch]

  # OutcomeBinding management
  - apiGroups: [opal.io]
    resources: [outcomebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [opal.io]
    resources: [outcomebindings/status]
    verbs: [get, update, patch]

  # Workload management (read + patch for config application)
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, update, patch]

  # HPA and PDB management (generated by OPAL)
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]

  # ConfigMaps for derived config storage
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]

  # Events for audit trail
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

  # Node and pod metrics for forecasting
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]

  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]

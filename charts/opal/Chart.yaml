apiVersion: v2
name: opal
description: >
  OPAL (Outcome-Predictive Agent Layer) — A Kubernetes-native control plane
  extension that replaces manual YAML with declared business outcomes and
  predictive pre-reconciliation powered by kagent AI agents.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - kubernetes
  - ai
  - agents
  - kagent
  - outcomes
  - slo
  - platform-engineering
  - cloud-native
home: https://github.com/opalnewharshal/opal
sources:
  - https://github.com/opalnewharshal/opal
maintainers:
  - name: HarshalSant
    email: harshalsant0@gmail.com
    url: https://github.com/opalnewharshal/opal
icon: https://raw.githubusercontent.com/opalnewharshal/opal/main/docs/logo.png
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Deep Insights
  artifacthub.io/changes: |
    - kind: added
      description: Initial release of OPAL
  artifacthub.io/crds: |
    - kind: WorkloadOutcome
      version: v1alpha1
      name: workloadoutcomes.opal.io
      displayName: Workload Outcome
      description: Declare business outcomes instead of Kubernetes configuration
    - kind: ClusterForecast
      version: v1alpha1
      name: clusterforecasts.opal.io
      displayName: Cluster Forecast
      description: AI-generated predictions about future cluster state
    - kind: OutcomeBinding
      version: v1alpha1
      name: outcomebindings.opal.io
      displayName: Outcome Binding
      description: Bind outcomes to workloads with approval policies
dependencies:
  - name: kagent
    repository: https://kagent-dev.github.io/kagent/helm-charts
    version: ">=0.1.0"
    condition: kagent.enabled

apiVersion: v1
kind: Service
metadata:
  name: {{ include "opal.fullname" . }}-controller-manager-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opal.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  selector:
    {{- include "opal.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: health
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
